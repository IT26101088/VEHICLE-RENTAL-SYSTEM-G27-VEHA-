<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Update profile | VEHA</title>
    <link rel="icon" href="assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .extra-wrap{max-width:1080px;margin:54px auto;padding:0 24px 80px}
        .extra-card{background:#fff;border:1px solid #e8e9ed;border-radius:22px;padding:28px;box-shadow:0 12px 35px #1b24300b;margin:18px 0}
        .extra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
        .extra-field label{display:block;font-weight:700;font-size:13px;margin:0 0 7px}
        .extra-field input,
        .extra-field select,
        .extra-field textarea{width:100%;padding:13px 14px;border:1px solid #dfe2e8;border-radius:12px;font:inherit;background:#fff}
        .extra-btn{border:0;border-radius:12px;background:#f36b32;color:white;font-weight:800;padding:13px 20px;cursor:pointer}
        .muted{color:#727987}.notice{padding:12px 14px;background:#fff4ec;border-radius:12px;color:#9a4b22;margin:12px 0}.data-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}
        @media(max-width:600px){.extra-card{padding:20px}}
    </style>
</head>
<body>
<header class="site-header" data-header>
    <div class="container nav">
        <a class="brand" href="index.html">
            <img src="assets/images/VEHA Orange V App Logo.png" alt="VEHA" style="height:38px">
        </a><nav class="nav__links" data-nav>
        <a href="index.html" data-nav-link="home">Home</a>
        <a href="vehicles.html" data-nav-link="vehicles">Vehicles</a>
        <a href="bookings.html" data-nav-link="bookings">My bookings</a>
        <a href="payments.html">Payments</a>
    </nav>
        <div data-auth-slot></div>
        <button class="nav__toggle" data-nav-toggle aria-label="Open menu">☰</button>
    </div>
</header>
<main class="extra-wrap">
    <p class="muted">VEHA / Profile / Update</p>
    <h1 style="font-family:Sora,sans-serif;font-size:clamp(30px,5vw,44px);margin:8px 0 10px">Update profile</h1>
    <p class="muted">Edit your contact information.</p>
    <section class="extra-card">
        <form id="profileForm" class="extra-grid">
            <div class="extra-field">
                <label>Full name</label>
                <input id="name" required>
            </div>
            <div class="extra-field">
                <label>Email</label>
                <input id="email" type="email" required>
            </div>
            <div class="extra-field">
                <label>Phone</label>
                <input id="phone" type="tel">
            </div>
            <div style="align-self:end">
                <button class="extra-btn">Save changes</button>
            </div>
        </form>
        <p id="msg" class="muted"></p>
    </section>

</main>
<script src="assets/js/data.js"></script>

<!-- New Update Profile Script -->
<script>
    (function () {
        var V = window.Veha;
        var current = V.getUser();

        var form = document.getElementById('profileForm');
        var msg = document.getElementById('msg');

        if (!current) {
            form.innerHTML = '<p>Please sign in to update your profile.</p>';
            return;
        }

        document.getElementById('name').value = current.name || '';
        document.getElementById('email').value = current.email || '';
        document.getElementById('phone').value = current.phone || '';

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            var next = Object.assign({}, current, {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim()
            });

            V.setUser(next);

            msg.textContent = 'Profile updated successfully.';
        });
    })();
</script>

<script src="assets/js/app.js"></script>
</body>
</html>
